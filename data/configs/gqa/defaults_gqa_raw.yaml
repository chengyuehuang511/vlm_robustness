datasets:
  gqa_raw:
    # data_dir: ${env.data_dir}/datasets
    data_type: images # [images|videos|features]

    build_info:
      # Be careful not to append minus sign (-) before split to avoid itemizing
      annotations:
        train:
          url:
              - https://storage.googleapis.com/sfr-vision-language-research/LAVIS/datasets/gqa/train_balanced_questions.json
          storage:
              - /coc/testnvme/chuang475/projects/vlm_robustness/datasets/gqa/questions/train_balanced_questions.json
        val:
          url:
              - https://storage.googleapis.com/sfr-vision-language-research/LAVIS/datasets/gqa/val_balanced_questions.json
          storage:
              - /coc/testnvme/chuang475/projects/vlm_robustness/datasets/gqa/questions/val_balanced_questions.json
        test:
          url:
              - https://storage.googleapis.com/sfr-vision-language-research/LAVIS/datasets/gqa/test_balanced_questions.json
          storage:
              - /coc/testnvme/chuang475/projects/vlm_robustness/datasets/gqa/questions/test_balanced_questions.json
      images:
          storage: /coc/testnvme/chuang475/projects/vlm_robustness/datasets/gqa/images/images/
