datasets:
  domainnet-quickdraw:
    question_type: what-is-in-image
    type: eval
model:
  arch: llava_vqa
  model_type: llava-1.5-7b-hf
  load_finetuned: true
  # finetuned_lp: /coc/pskynet4/chuang475/projects/LAVIS/lavis/output/Llava/DomainNet-Real/lp/20241121011/checkpoint_best.pth
  finetuned: /coc/pskynet4/chuang475/projects/LAVIS/lavis/output/Llava/DomainNet-Real/digrap_0.1/20241121110/checkpoint_best.pth
  # /coc/pskynet4/chuang475/projects/LAVIS/lavis/output/Llava/DomainNet-Real/digrap_0.01/20241122101/checkpoint_best.pth
  # /coc/pskynet4/chuang475/projects/LAVIS/lavis/output/Llava/DomainNet-Real/lpft/20241121091/checkpoint_best.pth
  # /coc/pskynet4/chuang475/projects/LAVIS/lavis/output/Llava/DomainNet-Real/digrap/20241120103/checkpoint_best.pth
  # /coc/pskynet4/chuang475/projects/LAVIS/lavis/output/Llava/DomainNet-Real/adamp/20241120102/checkpoint_best.pth
  # /coc/pskynet4/chuang475/projects/LAVIS/lavis/output/Llava/DomainNet-Real/ft/20241120005/checkpoint_best.pth
  load_pretrained: true
  lora_rank: 4
  target_modules: q_proj v_proj
  use_lora: 1
  wise: 0
run:
  batch_size_eval: 32
  batch_size_train: 16
  device: cuda
  dist_url: env://
  distributed: true
  evaluate: true
  inference_method: generate
  max_len: 10
  min_len: 1
  num_ans_candidates: 128
  num_beams: 5
  num_workers: 4
  output_dir: output/Llava/domainnet-quickdraw
  prompt: 'Question: {} Short answer:'
  seed: 42
  task: classifier_vqa
  test_splits:
    - test
  world_size: 8
